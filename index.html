<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Juegos de PSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white text-center p-4 shadow">
        <h1>Catálogo de Juegos de PSP</h1>
        <p class="lead">Agrega y comparte tus juegos favoritos</p>
    </header>

    <main class="container my-4">
        <section id="add-game-section" class="mb-5 p-4 border rounded shadow-sm bg-light">
            <h2><button class="btn btn-link text-decoration-none text-dark fs-4 p-0" type="button" data-bs-toggle="collapse" data-bs-target="#add-game-collapse" aria-expanded="false" aria-controls="add-game-collapse">
                Agregar Nuevo Juego ▼
            </button></h2>
            <div class="collapse" id="add-game-collapse">
                <form id="add-game-form" class="mt-3">
                    <div class="mb-3">
                        <label for="game-name" class="form-label">Nombre del Juego</label>
                        <input type="text" class="form-control" id="game-name" placeholder="Ej: God of War: Chains of Olympus" required>
                    </div>
                    <div class="mb-3">
                        <label for="game-image" class="form-label">URL de la Imagen de Portada</label>
                        <input type="url" class="form-control" id="game-image" placeholder="https://ejemplo.com/imagen.png" required>
                    </div>
                    <div class="mb-3">
                        <label for="game-description" class="form-label">Descripción</label>
                        <textarea class="form-control" id="game-description" rows="3" placeholder="Una breve descripción del juego..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="game-download" class="form-label">URL de Descarga</label>
                        <input type="url" class="form-control" id="game-download" placeholder="https://ejemplo.com/juego.iso" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Agregar Juego al Catálogo</button>
                </form>
            </div>
        </section>

        <hr>

        <section id="game-list-section">
            <h2 class="text-center mb-4">Juegos Disponibles</h2>
            <div id="game-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Los juegos se agregarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p>&copy; 2024 Catálogo de PSP</p>
    </footer>

    <button id="theme-toggle" class="btn btn-primary rounded-circle shadow-lg" title="Cambiar tema">
        <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
